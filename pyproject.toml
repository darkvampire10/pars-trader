[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pars-trader"
version = "0.1.0"
description = "Persian Telegram trading research and signal bot with testable risk primitives"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
pars-trader = "pars_trader.__main__:main"

[tool.setuptools.packages.find]
include = ["pars_trader*"]
